services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - traffic_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  traffic_data:
